# NEXUS AI — local Docker Compose setup.
#
#   docker compose up --build
#
# Ollama is NOT part of this compose file: it is a host service on Windows.
# `extra_hosts` publishes the host as `host.docker.internal` (needed on Linux;
# harmless on Windows/macOS where Docker Desktop already provides it), and
# OLLAMA_URL points the container at it.

services:
  nexus:
    build: .
    image: nexus-ai:local
    container_name: nexus-ai
    ports:
      - "8777:8777"
    volumes:
      - nexus-data:/app/data
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      NEXUS_AI_MAX_MODEL_GB: "5.5"
      NEXUS_AI_TIMEOUT: "90"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8777/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  nexus-data:
